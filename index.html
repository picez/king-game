<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <title>Card Majlis</title>
    <meta name="description" content="Card Majlis — a card lounge for King, Durak, Deberc, Tarneeb, Preferans, 51 & Poker. Local pass-and-play or online." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0e15" />
    <!-- Stage 42.0: stamp the saved colour theme before first paint (no flash).
         Mirrors src/ui/components/appThemeStore.ts + APP_THEME_KEY in src/net/prefs.ts. -->
    <script>
      try {
        var t = localStorage.getItem('king.appTheme.v1') === 'classic' ? 'classic' : 'midnight';
        document.documentElement.setAttribute('data-app-theme', t);
        if (t === 'classic') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d4f28');
      } catch (e) { document.documentElement.setAttribute('data-app-theme', 'midnight'); }
    </script>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS standalone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Card Majlis" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
